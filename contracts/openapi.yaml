components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-baseline-session
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          enum:
          - invalid
          - unauthenticated
          - forbidden
          - not_found
          - conflict
          - precondition_failed
          - too_large
          - unsupported_media
          - quota
          - unavailable
          - mode_disabled
        detail:
          type: string
          maxLength: 1000
        request_id:
          type: string
          format: uuid
        field_errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              code:
                type: string
            required:
            - path
            - code
            additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - detail
      - request_id
      additionalProperties: false
    Empty:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    ProjectCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        content_capture:
          type: string
          enum:
          - metadata_only
          - redacted
        external_transfer:
          type: boolean
      required:
      - name
      - content_capture
      - external_transfer
      additionalProperties: false
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        content_capture:
          type: string
          enum:
          - metadata_only
          - redacted
        external_transfer:
          type: boolean
        revision:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - content_capture
      - external_transfer
      - revision
      - created_at
      additionalProperties: false
    UploadCreate:
      type: object
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 200
        media_type:
          type: string
          enum:
          - application/pdf
          - application/json
          - application/zip
          - text/plain
        byte_size:
          type: integer
          minimum: 1
          maximum: 104857600
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        classification:
          type: string
          enum:
          - synthetic
          - public_authorized
          - sensitive
      required:
      - filename
      - media_type
      - byte_size
      - sha256
      - classification
      additionalProperties: false
    Upload:
      type: object
      properties:
        id:
          type: string
          format: uuid
        artifact_id:
          type: string
          format: uuid
        put_path:
          type: string
          pattern: ^/api/v1/
        expires_at:
          type: string
          format: date-time
        maximum_bytes:
          type: integer
          minimum: 1
      required:
      - id
      - artifact_id
      - put_path
      - expires_at
      - maximum_bytes
      additionalProperties: false
    UploadFinalize:
      type: object
      properties:
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        byte_size:
          type: integer
          minimum: 1
      required:
      - sha256
      - byte_size
      additionalProperties: false
    Artifact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        byte_size:
          type: integer
          minimum: 1
        media_type:
          type: string
        status:
          type: string
          enum:
          - pending
          - ready
          - quarantined
          - deleting
          - deleted
        classification:
          type: string
          enum:
          - synthetic
          - public_authorized
          - sensitive
        created_at:
          type: string
          format: date-time
      required:
      - id
      - project_id
      - sha256
      - byte_size
      - media_type
      - status
      - classification
      - created_at
      additionalProperties: false
    Job:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        kind:
          type: string
        state:
          type: string
          enum:
          - queued
          - leased
          - running
          - cancel_requested
          - succeeded
          - failed
          - timed_out
          - cancelled
          - failed_unknown_effect
        attempt:
          type: integer
          minimum: 0
        revision:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        result_id:
          type:
          - string
          - 'null'
          format: uuid
        error_code:
          type:
          - string
          - 'null'
      required:
      - id
      - project_id
      - kind
      - state
      - attempt
      - revision
      - created_at
      - result_id
      - error_code
      additionalProperties: false
    EventPayload:
      type: object
      properties:
        operation_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        outcome:
          type: string
          enum:
          - success
          - failure
          - unknown
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        content_artifact_id:
          type: string
          format: uuid
        redacted:
          type: boolean
        reason:
          type: string
          maxLength: 500
        missing_sequence_start:
          type: integer
          minimum: 0
        missing_sequence_end:
          type: integer
          minimum: 0
      required: []
      additionalProperties: false
    Event:
      type: object
      properties:
        schema_version:
          const: afr-event/1
        event_id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        producer_id:
          type: string
          minLength: 1
          maxLength: 100
        producer_seq:
          type: integer
          minimum: 0
        event_type:
          type: string
          enum:
          - run.started
          - run.finished
          - model.requested
          - model.responded
          - tool.requested
          - tool.responded
          - tool.failed
          - capture.dropped
          - approval.decided
        observed_at:
          type: string
          format: date-time
        capture_policy_id:
          type: string
          format: uuid
        parent_event_id:
          type:
          - string
          - 'null'
          format: uuid
        payload:
          $ref: '#/components/schemas/EventPayload'
      required:
      - schema_version
      - event_id
      - run_id
      - producer_id
      - producer_seq
      - event_type
      - observed_at
      - capture_policy_id
      - payload
      additionalProperties: false
    EventBatch:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
          minItems: 1
          maxItems: 500
      required:
      - events
      additionalProperties: false
    BatchReceipt:
      type: object
      properties:
        accepted:
          type: array
          items:
            type: string
            format: uuid
        duplicates:
          type: array
          items:
            type: string
            format: uuid
        request_id:
          type: string
          format: uuid
      required:
      - accepted
      - duplicates
      - request_id
      additionalProperties: false
    Run:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - recording
          - completed
          - failed
          - abandoned
        revision:
          type: integer
          minimum: 1
        event_count:
          type: integer
          minimum: 0
        completeness:
          type: array
          items:
            type: string
            enum:
            - sequence_gap
            - missing_terminal
            - orphan
            - content_not_captured
            - truncated
          uniqueItems: true
        verified_outcome:
          type: string
          enum:
          - unscored
          - pass
          - fail
          - error
        created_at:
          type: string
          format: date-time
      required:
      - id
      - project_id
      - state
      - revision
      - event_count
      - completeness
      - verified_outcome
      - created_at
      additionalProperties: false
    Check:
      type: object
      properties:
        kind:
          type: string
          enum:
          - json_equals
          - forbidden_tool
          - mock_state_equals
        path:
          type: string
          maxLength: 200
        expected:
          type:
          - string
          - number
          - boolean
          - object
          - array
          - 'null'
      required:
      - kind
      - path
      - expected
      additionalProperties: false
    CaseCreate:
      type: object
      properties:
        run_id:
          type: string
          format: uuid
        run_revision:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 120
        mode:
          type: string
          enum:
          - visual
          - recorded
        checks:
          type: array
          items:
            $ref: '#/components/schemas/Check'
          minItems: 1
          maxItems: 100
        fixture_artifact_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 100
      required:
      - run_id
      - run_revision
      - name
      - mode
      - checks
      - fixture_artifact_ids
      additionalProperties: false
    Case:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        schema_version:
          const: afr-case/1
        version:
          type: integer
          minimum: 1
        manifest_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        definition:
          $ref: '#/components/schemas/CaseCreate'
        created_at:
          type: string
          format: date-time
      required:
      - id
      - project_id
      - schema_version
      - version
      - manifest_sha256
      - definition
      - created_at
      additionalProperties: false
    ReplayCreate:
      type: object
      properties:
        case_id:
          type: string
          format: uuid
        case_version:
          type: integer
          minimum: 1
        mode:
          type: string
          enum:
          - visual
          - recorded
        maximum_seconds:
          type: integer
          minimum: 1
          maximum: 300
      required:
      - case_id
      - case_version
      - mode
      - maximum_seconds
      additionalProperties: false
    ReplayResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        case_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - pass
          - fail
          - error
          - unscored
        network_calls:
          const: 0
        checks:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
                minimum: 0
              outcome:
                type: string
                enum:
                - pass
                - fail
                - error
              reason:
                type: string
                maxLength: 500
            required:
            - index
            - outcome
            - reason
            additionalProperties: false
        manifest_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
      required:
      - id
      - job_id
      - case_id
      - state
      - network_calls
      - checks
      - manifest_sha256
      additionalProperties: false
    ProjectPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
          maxItems: 100
        next_cursor:
          type:
          - string
          - 'null'
      required:
      - items
      - next_cursor
      additionalProperties: false
    RunPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Run'
          maxItems: 100
        next_cursor:
          type:
          - string
          - 'null'
      required:
      - items
      - next_cursor
      additionalProperties: false
    EventPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
          maxItems: 100
        next_cursor:
          type:
          - string
          - 'null'
      required:
      - items
      - next_cursor
      additionalProperties: false
    CasePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Case'
          maxItems: 100
        next_cursor:
          type:
          - string
          - 'null'
      required:
      - items
      - next_cursor
      additionalProperties: false
